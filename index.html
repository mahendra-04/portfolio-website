<!doctype html>
<html lang="en">
  <head>
    <!--
      Vite serves this HTML as the app shell. React mounts into #root, while
      metadata, theme bootstrapping, and search/social preview tags live here so
      browsers and crawlers can read them before JavaScript finishes loading.
    -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      /*
        Apply the saved theme before the React bundle loads. This prevents the
        page from briefly flashing the wrong light/dark theme during startup.
        localStorage is wrapped in try/catch for privacy modes that block it.
      */
      (() => {
        try {
          document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark";
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <title>Mahendra Ranwa | IT Support Technician Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Mahendra Ranwa, an IT support technician focused on Windows support, troubleshooting, desktop setup, and help desk readiness."
    />
    <meta name="theme-color" content="#050816" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://mahendra-04.github.io/portfolio-website/" />
    <!-- Open Graph and Twitter metadata control how the portfolio appears when
         shared in messaging apps, LinkedIn, and other social previews. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mahendra Ranwa | IT Support Technician Portfolio" />
    <meta
      property="og:description"
      content="Explore Mahendra Ranwa's IT support portfolio, including desktop support skills, troubleshooting projects, and technical experience."
    />
    <meta property="og:url" content="https://mahendra-04.github.io/portfolio-website/" />
    <meta property="og:image" content="https://mahendra-04.github.io/portfolio-website/mahendra.jpeg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mahendra Ranwa | IT Support Technician Portfolio" />
    <meta
      name="twitter:description"
      content="IT support portfolio featuring Mahendra Ranwa's troubleshooting skills, technical projects, and support experience."
    />
    <meta name="twitter:image" content="https://mahendra-04.github.io/portfolio-website/mahendra.jpeg" />
    <!-- Structured data describes the portfolio owner as a Person. Search
         engines can use this to connect the site with profile links, education,

        },
        "sameAs": [
          "https://www.linkedin.com/in/mahendra-ranwa/",

        ],
        "alumniOf": {

          "name": "Sheridan College"
        }
      }
    </script>
